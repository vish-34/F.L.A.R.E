        temperature: 0.5
        max_tokens: 1500
      - provider: "openrouter"
        model: "openrouter/openrouter/free"
        temperature: 0.5
        max_tokens: 1500
      - provider: "ollama"
        model: "ollama/qwen3.5:27b"
        temperature: 0.5
        max_tokens: 1500

  # ----------------------------------------------------------------------------
  # 🧠 FLARE-REASONER-HEAVY: Deep Multi-Step Planning & Complex Analysis Workhorse
  # ----------------------------------------------------------------------------
  flare-reasoner-heavy:
    description: "Heavy reasoning specialist brain powered by DeepSeek V4 Pro & Nemotron 3 Ultra"
    primary:
      provider: "nvidia"
      model: "openai/deepseek-v4-pro-0813"
      api_base: "https://integrate.api.nvidia.com/v1"
      temperature: 0.6
      max_tokens: 4000
    fallbacks:
