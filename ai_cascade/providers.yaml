        temperature: 0.6
        max_tokens: 4000
      - provider: "nvidia"
        model: "openai/kimi-k3"
        api_base: "https://integrate.api.nvidia.com/v1"
        temperature: 0.6
        max_tokens: 4000
      - provider: "gemini"
        model: "gemini/gemini-3.1-pro"
        temperature: 0.6
        max_tokens: 4000
      - provider: "openrouter"
        model: "openrouter/nvidia/nemotron-3-ultra:free"
        temperature: 0.6
        max_tokens: 4000
      - provider: "cerebras"
        model: "cerebras/gpt-oss-120b"
